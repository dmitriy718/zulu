[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zulu-platform"
version = "0.1.0"
description = "Zulu stocks/options trading intelligence and risk-governed automation platform."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.4",
  "arq==0.28.0",
  "fastapi==0.137.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "redis==5.3.1",
  "sqlalchemy==2.0.51",
  "structlog==26.1.0",
  "uvicorn[standard]==0.49.0",
]

[dependency-groups]
dev = [
  "mypy==2.1.0",
  "pytest==9.1.0",
  "ruff==0.15.17",
]

[tool.setuptools.packages.find]
where = [
  "packages/contracts/src",
  "packages/observability/src",
  "packages/policy/src",
  "packages/risk/src",
  "services/api/src",
  "services/execution/src",
  "services/learning/src",
  "services/signal-intelligence/src",
]
include = ["zulu_*"]

[tool.pytest.ini_options]
testpaths = [
  "packages/contracts/tests",
  "packages/observability/tests",
  "packages/policy/tests",
  "packages/risk/tests",
  "services/api/tests",
  "services/execution/tests",
  "services/learning/tests",
  "services/signal-intelligence/tests",
  "tests",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"services/api/src/zulu_api/auth.py" = ["B008"]
"services/api/src/zulu_api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
  "packages/contracts/src",
  "packages/observability/src",
  "packages/policy/src",
  "packages/risk/src",
  "services/api/src",
  "services/execution/src",
  "services/learning/src",
  "services/signal-intelligence/src",
]
files = ["packages", "services", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true
